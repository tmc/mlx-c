# Declared removals from the API lock.
#
# Regeneration is free to grow the surface but may not shrink it silently: a
# function that the previously committed codegen/mlxc-capi.lock.json recorded
# and that a regeneration no longer emits must be listed here, with why it went
# and what happens next. An entry naming a function that is still present is
# stale and fails the gate.
#
# The baseline is the lock at the git ref given by --baseline-ref (HEAD by
# default), not the working-tree file: by the time the gate runs, regeneration
# has already rewritten the working tree.

schema_version: 1

removals:
  - target: mlxc
    name: mlx_count_nonzero_axis
    reason: >-
      Renamed during the upstream-parity heal: the (axis, keepdims) overload
      now binds under the base name mlx_count_nonzero to match
      upstream/mlx-v0.32.0, which is what a consumer calling the shared name
      links against.
    resolution: >-
      Consumers regenerate; the symbol is not lost — it is the base name now.
      The bare-keepdims overload binds additively as
      mlx_count_nonzero_keepdims.
  - target: mlxc
    name: mlx_flip_axes
    reason: >-
      Renamed during the upstream-parity heal: the axes-vector overload now
      binds under the base name mlx_flip to match upstream/mlx-v0.32.0. On
      the previous line the base name held the no-axes overload, which broke
      an upstream consumer at link time.
    resolution: >-
      Consumers regenerate; the axes form is the base name, the axis form
      stays mlx_flip_axis, and the bare form binds as mlx_flip_all.
  - target: mlxc
    name: mlx_unstack_axis
    reason: >-
      Renamed during the upstream-parity heal: the axis overload now binds
      under the base name mlx_unstack to match upstream/mlx-v0.32.0.
    resolution: >-
      Consumers regenerate; the axis form is the base name and the bare form
      binds as mlx_unstack_all.
  - target: mlxc
    name: mlx_flip_axis
    reason: >-
      Dropped additive sugar: upstream/mlx-v0.32.0 has no single-axis flip and
      a C caller can pass a one-element axes array to mlx_flip.
    resolution: >-
      Consumers pass a one-element axes array to mlx_flip.
  - target: mlxc
    name: mlx_flip_all
    reason: >-
      Dropped additive sugar: flipping all axes is expressible by passing the
      array's full axis range to mlx_flip.
    resolution: >-
      Consumers pass the full axis range to mlx_flip.
  - target: mlxc
    name: mlx_unstack_all
    reason: >-
      Dropped additive sugar: unstacking along the default axis is the same
      call as mlx_unstack with that axis made explicit.
    resolution: >-
      Consumers pass the default axis explicitly to mlx_unstack.
  - target: mlxc
    name: mlx_count_nonzero_axes
    reason: >-
      Dropped additive sugar: no vector-axes overload exists in
      upstream/mlx-v0.32.0; per-axis counts are expressible with repeated
      mlx_count_nonzero calls.
    resolution: >-
      Consumers call mlx_count_nonzero once per axis.
  - target: mlxc
    name: mlx_count_nonzero_keepdims
    reason: >-
      Dropped additive sugar: the keepdims-only overload duplicates
      mlx_count_nonzero with keepdims=false.
    resolution: >-
      Consumers call mlx_count_nonzero with keepdims as needed.
  - target: mlxc
    name: mlx_astype_copy
    reason: >-
      Ratified for the v0.32.0 cut: nothing consumes copy control today and
      the base mlx_astype covers the same cast; re-adding later is a one-line
      manifest unskip.
    resolution: >-
      Consumers call mlx_astype.
  - target: mlxc
    name: mlx_fast_metal_kernel_new_math_mode
    reason: >-
      Ratified for the v0.32.0 cut: the base mlx_fast_metal_kernel_new
      already matches upstream exactly and every in-repo caller passed the
      default math mode.
    resolution: >-
      Consumers call mlx_fast_metal_kernel_new; the hooks template machinery
      stays dormant for when a non-default consumer appears.
